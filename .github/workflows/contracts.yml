name: Source and contract validation
on:
  push:
    branches: [main, codex/pagebound-recovery]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - name: Render current evidence without upgrading incomplete requirements
        run: python scripts/render_claims.py
      - name: Retain validation, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pagebound-contracts-${{ github.sha }}
          path: |
            artifacts/validation/
            artifacts/public-small/summary.json
            RESULTS.md
          if-no-files-found: error
          retention-days: 90
  synthetic-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install rendering dependencies
        run: python -m pip install reportlab==5.1.0 pypdfium2==5.15.0 pdfplumber==0.11.10 pillow==13.0.0
      - name: Rebuild authored fixtures and native extraction
        run: |
          python evaluator/generate_fixtures.py
          python scripts/render_synthetic.py
          python scripts/extract_native_synthetic.py
          python scripts/render_claims.py
          node site/build.mjs
      - name: Retain synthetic preview and public extraction receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pagebound-synthetic-preview-${{ github.sha }}
          path: |
            site/dist/
            artifacts/public-small/
            artifacts/manifests/synthetic-packets.json
          if-no-files-found: error
          retention-days: 90
